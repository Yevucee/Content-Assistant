<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
    <title>{% block title %}{{ title }}{% endblock %} — Content Harness</title>
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-root">
      <header class="app-topbar">
        <a class="app-logo" href="/">Content Harness</a>
        {% block primary_nav %}{% include "partials/primary_nav.html" %}{% endblock %}
      </header>
      <main id="main" class="app-main">{% block content %}{% endblock %}</main>
    </div>
    {% block tabbar %}{% endblock %}
  </body>
</html>
