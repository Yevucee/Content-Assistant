# Railway: two services, same Dockerfile.
#
# 1) API — use image default start (uvicorn, respects $PORT). See docs/railway.md.
# 2) Worker — in Railway dashboard set start command: python -m apps.worker.main
#
# Both must share the same DATABASE_URL (Railway Postgres). Do not use SQLite for production.
# Full checklist: docs/railway.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
