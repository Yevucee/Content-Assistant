# Railway: create two services from the same repo.
#
# Service 1 — API
#   Build: Dockerfile default CMD (uvicorn)
#   Start: (default)
#   Variables: DATABASE_URL, OPENAI_*, APP_BASE_URL, etc.
#
# Service 2 — Worker
#   Build: same image
#   Start command override: python -m apps.worker.main
#   Variables: same DATABASE_URL, OPENAI_*, WEEKLY_CRON optional
#
# Database: add Railway Postgres plugin; set DATABASE_URL to the plugin reference.
#
# Weekly runs: prefer Railway Cron hitting POST /runs/trigger with a secret header,
# or enable WEEKLY_CRON on the worker in Milestone 5.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
