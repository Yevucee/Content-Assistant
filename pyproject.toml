[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-harness"
version = "0.1.0"
description = "Multi-brand AI editorial content production harness"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "eval-type-backport>=0.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "feedparser>=6.0.11",
    "structlog>=24.1.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
